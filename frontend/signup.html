<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css\style.css"/>
    <title>Sign up - RVA Events</title>
    
</head>
<body>
    <div class="login-container">
        <h1>Sign up</h1>
        
        <form class="form-container" id="createAccountForm" novalidate>
            <div class="input-group">
                <label>Enter your email:</label>
                <input type="email" id="email" name= "email" placeholder="example@example.com" maxlength="50" required>
                <p class="error-message" id="email-error" role="alert"></p>
            </div>

            <div class="input-group">
                <label>Enter your password:</label>
                <input type="password" id="password" name= "password" maxlength="64" required>
                <p class="error-message" id="password-error" role="alert"></p>

                <label>Confirm your password:</label>
                <input type="password" id="confirmPassword" name= "confirmPassword" maxlength="64" required>
                <p class="error-message" id="confirmPassword-error" role="alert"></p>
            </div>
            <hr>
            <input type="submit" id="createAccountButton" value="Create Account">
        </form>
    </div>

    <script type="module" src="js/signup.js"></script>
    <!--<script src="js/v.js"></script>-->
</body>
</html>
